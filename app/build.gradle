    // ── PASS 20 (§8 — secure release signing) ────────────────────────────────
    // Credentials NEVER live in the repository or the source ZIP. Resolution
    // order (first hit wins):
    //   1. environment variables  LDX_STORE_FILE / LDX_STORE_PASSWORD /
    //      LDX_KEY_ALIAS / LDX_KEY_PASSWORD
    //   2. the GIT-IGNORED local file  signing.local.properties  at the
    //      project root with plain keys storeFile / storePassword /
    //      keyAlias / keyPassword (see signing.local.properties.example).
    // The official release identity is the keystore documented in the
    // private signing backup (alias lumidrop-release); a release build
    // without credentials is left UNSIGNED rather than silently signed
    // with some other key.
    def ldxProps = new Properties()
    def ldxLocal = rootProject.file('signing.local.properties')
    if (ldxLocal.exists()) ldxProps.load(new FileInputStream(ldxLocal))
    def ldxStorePath = System.getenv('LDX_STORE_FILE') ?: ldxProps.getProperty('storeFile')
    def ldxStorePass = System.getenv('LDX_STORE_PASSWORD') ?: ldxProps.getProperty('storePassword')
    def ldxKeyAlias = System.getenv('LDX_KEY_ALIAS') ?: ldxProps.getProperty('keyAlias')
    def ldxKeyPass  = System.getenv('LDX_KEY_PASSWORD') ?: ldxProps.getProperty('keyPassword')

    signingConfigs {
        release {
            if (ldxStorePath != null && ldxStorePass != null && ldxKeyAlias != null && ldxKeyPass != null) {
                storeFile rootProject.file(ldxStorePath)
                storePassword ldxStorePass
                keyAlias ldxKeyAlias
                keyPassword ldxKeyPass
                // §8.3: match the published v1.0.1 signature surface exactly
                // (v1+v2+v3) so any installer that keyed on the scheme set
                // sees an identical signing configuration.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // §8: signed ONLY when the complete official credential set is
            // present; an unsigned artifact is the honest failure mode.
            if (ldxStorePath != null && ldxStorePass != null && ldxKeyAlias != null && ldxKeyPass != null) {
                signingConfig signingConfigs.release
            }
        }
        debug   { minifyEnabled false }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions  { jvmTarget = '11' }
    buildFeatures  { viewBinding true }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

