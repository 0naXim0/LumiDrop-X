name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests
        run: ./gradlew --no-daemon test
      - name: Assemble unsigned debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare release APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk LumiDrop-X-v1.0.1-universal.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiDrop-X-v1.0.1
          path: LumiDrop-X-v1.0.1-universal.apk
          if-no-files-found: error
